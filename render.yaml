# Render Blueprint — ONLY the PayMongo payment gateway (docs/redesign/SPEC-PAYMENT-GATEWAY.md).
# The rest of EngiRent runs on the self-hosted server PC, not on Render.
# The old whole-stack blueprint is in docs/predated/deploy/render-2026-08-old-stack.yaml.
#
# THIS REPO IS PUBLIC: no secret goes in this file. Every value marked `sync: false`
# is typed into the Render dashboard (hosting guide, SPEC section 8).
services:
  # ─── Sandbox (TEST keys, no real money). Allowed to sleep. ───────────────────
  - type: web
    name: engirent-pay-sandbox
    runtime: node
    plan: free
    region: singapore
    rootDir: server/payment_gateway
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PAYMENT_ENV
        value: sandbox
      - key: NODE_VERSION
        value: "22"
      - key: ENDPOINT_GIST_URL
        value: https://gist.githubusercontent.com/Shaloh69/c9c8b972eb40e09fb42e726668404045/raw/engirent-endpoint.json
      - key: PAYMONGO_SECRET_KEY
        sync: false            # sk_test_... (the gateway refuses to start with anything else)
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false            # whsk_... from the TEST-mode webhook (guide 8.4); empty until then
      - key: GATEWAY_TOKEN
        sync: false            # 32+ random chars; the same value goes in the main API's PAYMENT_GATEWAY_SANDBOX_TOKEN
      - key: PAYMONGO_SOURCE_ACCOUNT_NUMBER
        sync: false            # optional: the TEST wallet, for test transfers
      - key: PAYMONGO_SOURCE_ACCOUNT_NAME
        sync: false

  # ─── Production (LIVE keys, real money). Kept awake by an uptime monitor (D1). ─
  - type: web
    name: engirent-pay-live
    runtime: node
    plan: free
    region: singapore
    rootDir: server/payment_gateway
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # A code change must never reach the real-money gateway unreviewed:
    # deploy it by hand (Render dashboard -> Manual Deploy) after sandbox passes.
    autoDeploy: false
    envVars:
      - key: PAYMENT_ENV
        value: live
      - key: NODE_VERSION
        value: "22"
      - key: ENDPOINT_GIST_URL
        value: https://gist.githubusercontent.com/Shaloh69/c9c8b972eb40e09fb42e726668404045/raw/engirent-endpoint.json
      - key: ALLOW_LIVE
        sync: false            # type "yes" only when going live (guide 8.7); without it the service refuses to start
      - key: PAYMONGO_SECRET_KEY
        sync: false            # the ROTATED sk_live_... key; only here, nowhere else
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false            # whsk_... from the LIVE-mode webhook
      - key: GATEWAY_TOKEN
        sync: false            # a DIFFERENT 32+ char value from sandbox
      - key: PAYMONGO_SOURCE_ACCOUNT_NUMBER
        sync: false            # the platform's PayMongo wallet, for owner payouts
      - key: PAYMONGO_SOURCE_ACCOUNT_NAME
        sync: false
