name: engirent
description: EngiRent Hub - IoT-powered Smart Kiosk System for student rentals
publish_to: 'none'
version: 1.6.0+16

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Localisation scaffolding — checklist Stage 9. Ships with the SDK, so it
  # tracks whatever intl version this Flutter install bundles rather than
  # taking its own pin — that's why it's declared as `sdk: flutter` instead
  # of a version constraint like every other dependency here.
  flutter_localizations:
    sdk: flutter

  # Typography — mandate §1.2 three-family stack (Space Grotesk /
  # IBM Plex Mono / Manrope), same families as every other surface.
  google_fonts: ^6.2.1

  # Animated mesh-gradient background — mandate §1.5. react-bits is
  # React-only, so the phone app uses a Flutter shader-based equivalent.
  mesh_gradient: ^1.3.8

  # Onboarding + in-app tutorial — mandate §2.2.
  # showcaseview drives the "?" coach-mark tour (highlights a widget and
  # explains it); introduction_screen drives the first-open walkthrough.
  showcaseview: ^5.1.0
  introduction_screen: ^4.0.0
  smooth_page_indicator: ^2.0.1

  # Skeleton placeholders while item lists load, instead of a bare spinner.
  shimmer: ^3.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.2
  http_parser: ^4.0.2
  socket_io_client: ^2.0.3+1
  mime: ^2.0.0

  # Offline resilience — mandate §2.10.1 / checklist Stage 4. Campus wifi is
  # intermittent and the kiosk sits in a corridor; before this, any request
  # failure was a dead end with a toast and no way to know if it was you or
  # the network.
  connectivity_plus: ^6.1.3

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Image Handling
  image_picker: ^1.0.7

  # Listing video (checklist Stage 7) — playback only; the picker's own
  # camera source already caps recording duration.
  video_player: ^2.9.2

  # Camera (in-app photo capture for face + ID registration)
  camera: ^0.11.0+2

  # QR Code
  mobile_scanner: ^5.2.3

  # WebView (PayMongo checkout) — Android/iOS only, no Flutter Web or
  # Windows/Linux/macOS desktop implementation exists. url_launcher is the
  # fallback for those platforms (see payment_webview_screen.dart).
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.1

  # Date & Time
  intl: ^0.20.2
  timeago: ^3.6.0

  # Notifications / Toasts
  toastification: ^2.1.0

  # Crash reporting — mandate §2.10.1. Before this the app had no reporter and
  # no FlutterError.onError handler at all, so a crash on a student's phone
  # was completely invisible. The DSN is supplied at build time via
  # --dart-define=SENTRY_DSN=…; with none supplied the app still runs and
  # installs its global handlers, it just reports locally.
  sentry_flutter: ^8.9.0

  # Real version+build for crash tagging. AppConstants.appVersion was a
  # hardcoded '1.0.0' that had drifted five minor versions from pubspec.
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Checklist Stage 9 — turns the ARB files under lib/l10n/ (see l10n.yaml)
  # into the generated AppLocalizations class main.dart wires up.
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
